openapi: 3.0.3
info:
  title: Payment Service API
  description: Reactive JSON API used by the market application to check and debit the payment balance.
  version: 1.0.0
servers:
  - url: http://localhost:8081
tags:
  - name: Payments
    description: Balance and payment operations
paths:
  /api/v1/balance:
    get:
      tags:
        - Payments
      operationId: getBalance
      summary: Get the current account balance
      security:
        - oauth2:
            - payment.read
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          description: Invalid customer identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid OAuth2 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access token does not grant the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Payment service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/payment:
    post:
      tags:
        - Payments
      operationId: makePayment
      summary: Debit an amount from the account
      security:
        - oauth2:
            - payment.write
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid OAuth2 access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access token does not grant the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Insufficient funds or an idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal payment error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 Client Credentials authorization for the market application.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8082/realms/market/protocol/openid-connect/token
          scopes:
            payment.read: Read a customer's payment balance.
            payment.write: Debit a customer's payment balance.
  parameters:
    CustomerId:
      name: X-Customer-Id
      in: header
      required: true
      description: Immutable customer identifier asserted by the authorized market application.
      schema:
        type: string
        format: uuid
  schemas:
    BalanceResponse:
      type: object
      additionalProperties: false
      required:
        - balance
      properties:
        balance:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 1000000.00
    PaymentRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - amount
      properties:
        requestId:
          type: string
          format: uuid
          description: Stable idempotency key supplied by the market application.
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          example: 1499.90
    PaymentResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - amount
        - remainingBalance
      properties:
        requestId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
        remainingBalance:
          type: number
          minimum: 0
          multipleOf: 0.01
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INSUFFICIENT_FUNDS
        message:
          type: string
          example: Insufficient funds
        availableBalance:
          type: number
          minimum: 0
          multipleOf: 0.01
        requiredAmount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
