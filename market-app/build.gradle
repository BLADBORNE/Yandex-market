plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.openapi.generator'
}

def generatedOpenApiDir = layout.buildDirectory.dir('generated/openapi')

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    compileOnly 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:r2dbc'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
}

openApiGenerate {
    generatorName = 'java'
    library = 'webclient'
    inputSpec = "$rootDir/openapi/payment-api.yaml"
    outputDir = generatedOpenApiDir.get().asFile.absolutePath
    apiPackage = 'ru.yandex.market_app.payment.generated.api'
    modelPackage = 'ru.yandex.market_app.payment.generated.model'
    invokerPackage = 'ru.yandex.market_app.payment.generated.invoker'
    generateApiDocumentation = false
    generateModelDocumentation = false
    generateApiTests = false
    generateModelTests = false
    configOptions = [
        sourceFolder               : 'src/main/java',
        dateLibrary                : 'java8',
        useJakartaEe               : 'true',
        openApiNullable            : 'false',
        serializationLibrary       : 'jackson',
        hideGenerationTimestamp    : 'true',
        webclientBlockingOperations: 'false'
    ]
}

sourceSets {
    main {
        java {
            srcDir generatedOpenApiDir.map { it.dir('src/main/java') }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.named('openApiGenerate') {
    inputs.file(rootProject.file('openapi/payment-api.yaml'))
    outputs.dir(generatedOpenApiDir)
}

bootJar {
    archiveFileName = 'market-app.jar'
}

tasks.named('jar') {
    enabled = false
}

springBoot {
    mainClass = 'ru.yandex.market_app.MarketAppApplication'
}
