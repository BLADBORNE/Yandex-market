<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container p-4">
        <div class="card text-center">
            <div class="card-body">
                <h1 class="card-title" th:text="${errorResponse != null ? errorResponse.status() : status}">500</h1>
                <h4 th:text="${errorResponse != null ? errorResponse.error() : error}">Ошибка</h4>
                <p class="card-text"
                   th:text="${errorResponse != null ? errorResponse.message() : (#strings.isEmpty(message) ? 'Не удалось выполнить запрос' : message)}">
                    Не удалось выполнить запрос
                </p>
                <a href="/items" class="btn btn-success">Вернуться в каталог</a>
            </div>
            <div class="card-footer text-body-secondary"
                 th:text="${errorResponse != null ? errorResponse.timestamp() : timestamp}">
            </div>
        </div>
    </div>
</body>

</html>
