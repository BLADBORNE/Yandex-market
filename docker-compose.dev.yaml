services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/market-realm.json:/opt/keycloak/data/import/market-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8082
      PAYMENT_OAUTH_CLIENT_SECRET: ${PAYMENT_OAUTH_CLIENT_SECRET:?Set PAYMENT_OAUTH_CLIENT_SECRET}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  market-db:
    image: postgres:17.2
    container_name: market-app-db
    ports:
      - "5432:5432"
    volumes:
      - market-app-data-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: qwerty
      PGDATA: /var/lib/postgresql/data/psqldata
    healthcheck:
      test: [ CMD-SHELL, pg_isready -U dev -d market_db ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  market-app-data-storage:
