services:
  market-service:
    build:
      context: .
      target: market-app
    ports:
      - "8080:8080"
    depends_on:
      market-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      HOST: market-db
      PORT: 5432
      POSTGRES_DB: market_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: qwerty
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8081
      PAYMENT_OAUTH_TOKEN_URI: http://keycloak:8080/realms/market/protocol/openid-connect/token
      PAYMENT_OAUTH_CLIENT_ID: market-app
      PAYMENT_OAUTH_CLIENT_SECRET: ${PAYMENT_OAUTH_CLIENT_SECRET:?Set PAYMENT_OAUTH_CLIENT_SECRET}
      PAYMENT_RETRY_DELAY: 200ms

  payment-service:
    build:
      context: .
      target: payment-service
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PAYMENT_INITIAL_BALANCE: "1000000.00"
      PAYMENT_OAUTH_ISSUER_URI: http://localhost:8082/realms/market
      PAYMENT_OAUTH_JWK_SET_URI: http://keycloak:8080/realms/market/protocol/openid-connect/certs
      PAYMENT_OAUTH_AUDIENCE: payment-service
      PAYMENT_OAUTH_AUTHORIZED_CLIENT_ID: market-app
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/market-realm.json:/opt/keycloak/data/import/market-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8082
      PAYMENT_OAUTH_CLIENT_SECRET: ${PAYMENT_OAUTH_CLIENT_SECRET:?Set PAYMENT_OAUTH_CLIENT_SECRET}
    healthcheck:
      test: >-
        bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
        grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  market-db:
    image: postgres:17.2
    container_name: market-app-db
    ports:
      - "5432:5432"
    volumes:
      - market-app-data-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: qwerty
      PGDATA: /var/lib/postgresql/data/psqldata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d market_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  market-app-data-storage:
