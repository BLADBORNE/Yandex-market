plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.openapi.generator'
}

def generatedOpenApiDir = layout.buildDirectory.dir('generated/openapi')

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'jakarta.annotation:jakarta.annotation-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

openApiGenerate {
    generatorName = 'spring'
    library = 'spring-boot'
    inputSpec = "$rootDir/openapi/payment-api.yaml"
    outputDir = generatedOpenApiDir.get().asFile.absolutePath
    apiPackage = 'ru.yandex.payment_service.generated.api'
    modelPackage = 'ru.yandex.payment_service.generated.model'
    invokerPackage = 'ru.yandex.payment_service.generated'
    generateApiDocumentation = false
    generateModelDocumentation = false
    generateApiTests = false
    generateModelTests = false
    globalProperties = [
        apis  : '',
        models: ''
    ]
    configOptions = [
        sourceFolder             : 'src/main/java',
        reactive                 : 'true',
        useSpringBoot3           : 'true',
        delegatePattern          : 'true',
        interfaceOnly            : 'false',
        skipDefaultInterface     : 'false',
        includeHttpRequestContext: 'false',
        useResponseEntity        : 'true',
        useBeanValidation        : 'true',
        performBeanValidation    : 'true',
        openApiNullable          : 'false',
        hideGenerationTimestamp  : 'true',
        useSwaggerUI             : 'false',
        useTags                  : 'true',
        annotationLibrary        : 'none',
        documentationProvider    : 'none'
    ]
}

sourceSets {
    main {
        java {
            srcDir generatedOpenApiDir.map { it.dir('src/main/java') }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.named('openApiGenerate') {
    inputs.file(rootProject.file('openapi/payment-api.yaml'))
    outputs.dir(generatedOpenApiDir)
}

bootJar {
    archiveFileName = 'payment-service.jar'
}

tasks.named('jar') {
    enabled = false
}

springBoot {
    mainClass = 'ru.yandex.payment_service.PaymentServiceApplication'
}
